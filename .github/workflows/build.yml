name: build repository

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: package-repository
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq createrepo-c rpm
      - run: echo "$GPG_PRIVATE_KEY" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      - id: build
        run: |
          version=$(./build.sh)
          printf 'ver=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - if: steps.build.outputs.ver != 'unchanged'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add yonder ${{ steps.build.outputs.ver }}"
          git push
      - name: Rebuild the public package repository
        if: steps.build.outputs.ver != 'unchanged'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
