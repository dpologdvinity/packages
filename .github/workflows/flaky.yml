name: Update Flaky APT packages

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: package-repository
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils
      - name: Import existing repository signing key
        run: printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      - name: Verify and index released packages
        id: build
        run: |
          version=$(./update-flaky.sh)
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Publish repository update
        if: steps.build.outputs.version != 'unchanged'
        env:
          FLAKY_VERSION: ${{ steps.build.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apt .flaky-version
          git commit -m "feat: add flaky $FLAKY_VERSION"
          git push
      - name: Rebuild the public APT repository
        if: steps.build.outputs.version != 'unchanged'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
