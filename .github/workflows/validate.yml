name: Validate package publisher

on:
  pull_request:
    paths:
      - '*.sh'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils shellcheck
      - run: shellcheck build-apt.sh update-flaky.sh test-update-flaky.sh
      - run: ./test-update-flaky.sh
